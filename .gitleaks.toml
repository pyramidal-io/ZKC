title = "ZKC public snapshot secret scan"

# Keep the default rules and match reviewed public values by exact file,
# rule, and line so unrelated content in the same file is still scanned.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed public H(zkc/credential) assertion"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\nassert DOMAIN_ZKC_CREDENTIAL == 0x3010B194AEAE94550E7A48D065D9DC931108C2D15136704BF4AD78EAE07F0E26$''',
]
paths = [
  '''^python/zkc_crypto/kdc\.py$''',
]

[[allowlists]]
description = "Reviewed ZKC canonical master-seed credential-binding KAT values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"credentialBindingKey"\s*:\s*"0x(?:214266e62f30fbe36989a56722253ef4b4f05c73e7e6e79561523f86bbc0bf69|156363709184916cfd39a0ff03728d2f61eeb21db527764a632ced26248620a9|0f9ae0ed0936446399b4d8860ba56fad98f3cde0e234351498f9b47157e47770|2e0ec1d6d13e07e096d6e97072ada506cfd048265c8e715b48cdb52222211acc|13f7a19491d111e859b706bbf4ac09ae04b9ae617fd9810f2c2abc79498b25f7)"\s*,?\s*$''',
]
paths = [
  '''^tests/vectors/kdc_master_seed_v1\.json$''',
]

[[allowlists]]
description = "Reviewed ZKC core BN254/Poseidon2 KAT fields and exact values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"zkc_credential"\s*:\s*"0x3010b194aeae94550e7a48d065d9dc931108c2d15136704bf4ad78eae07f0e26"\s*,?\s*$''',
  '''^\s*"credential_binding_key"\s*:\s*"0x2245b9bc69578eaf6d9975c8f8dab4e9d434080bb0f38fb602f11c5074220105"\s*,?\s*$''',
  '''^\s*"new_credential_binding_key"\s*:\s*"0x062c4390e12a851c21fcd86d13f3f823cdfe520007d641f107af2ccb31a74100"\s*,?\s*$''',
  '''^\s*"credential_type_field"\s*:\s*"0x01b0dd23c6a0f5754a8d19e2e3d8c292388f0e201e5fc5516a65727d507154ec"\s*,?\s*$''',
  '''^\s*"credential_digest"\s*:\s*"0x09b79189d09dfe779f5a3acb11a275cde4431197df5bd9d9b0214eac6cca5ac6"\s*,?\s*$''',
]
paths = [
  '''^tests/vectors/zkc_core_vectors\.json$''',
]

[[allowlists]]
description = "Reviewed AFP-KDC conformance-vector exact public key values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"spendingKey"\s*:\s*"0x(?:182877c456caaec9e58390c15c8001c817b8566d8952afd55e5484edbe68363c|144fa23c717e08e4e14147010d31e2aadd3e7ebb761198d4cbaae23f62b3ef67|2aa6de3a01fec0825909dae75f37e1b6093ba378df2965185d135fcd0f6fd421|054bffb9c2753d29eb67714bedaec3f6f909f62d0b6edc3e8b32f5feae599dd1|25c8b56ae92ceeb873fdba8ebded92b2da7b03fe6330fd464bc68ef60e43d35c)"\s*,?\s*$''',
  '''^\s*"viewingKey"\s*:\s*"0x(?:01a4f9348723ddb88b8cb51bfefa165779b20a0595bcb728fcb56a65b3115575|16b8d89ff569ae13d9dc795f0dc70fe3283bc0c9fd66367ea39616d716a33a5d|116d9a4fe480c1d976f48d0122a49fe919de71e813719fa3514bbfd629ab1e02|17f2e28a96e45b73ffbe05ae5568b726392f10047e1a2b1ed6a8597c5798665f|302a0ff15a9d16b4f00df3ab76b71a7182b9850d6ec33411515f776f9083ab8d)"\s*,?\s*$''',
  '''^\s*"proofKey"\s*:\s*"0x(?:292019ef1768ba0fa512e5ad8442592135ba8c6fcc75824b68858e518771985c|23817d38a9dd9cee841fe099e73e3bdf7dc94877661df70d6ce7bede7f741846|0bb78d04ccc163c139ff540e6a28ec440ae3e391a19c294b0ee525fad07bd648|2b4003b5718df23357bbbaf25b96eb4cea82405b01d5f8a47d1567a779e76b63|01b48895c3cc1bf9626fe911881b27a856f6fe5c7f73587a647cc3095299f1a6)"\s*,?\s*$''',
  '''^\s*"credentialBindingKey"\s*:\s*"0x(?:214266e62f30fbe36989a56722253ef4b4f05c73e7e6e79561523f86bbc0bf69|156363709184916cfd39a0ff03728d2f61eeb21db527764a632ced26248620a9|0f9ae0ed0936446399b4d8860ba56fad98f3cde0e234351498f9b47157e47770|2e0ec1d6d13e07e096d6e97072ada506cfd048265c8e715b48cdb52222211acc|13f7a19491d111e859b706bbf4ac09ae04b9ae617fd9810f2c2abc79498b25f7)"\s*,?\s*$''',
]
paths = [
  '''^tests/vectors/crypto/afp_kdc_v1_0_2_conformance\.json$''',
]

[[allowlists]]
description = "Reviewed SHA-256 pins of six public ZKC rebind artifacts"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\n?    "schemas/public\-inputs/zkc_credential_rebind\.json": "9c97d540e216bd3347cbe5e72db9e58a26d86fdabcd52a9f861d186a74341fd1",$''',
  '''^\n?    "schemas/public\-inputs/zkc_credential_rebind_v2\.json": "49b37999988b16f67277364dc3e4590b6a3713f9e52adbe001a6c9a62a2b9de3",$''',
  '''^\n?    "schemas/public\-input\-bindings/zkc_credential_rebind\.json": "92c11bb320b10aa67a002e0df902bb2e6a13dd4693ba156c66046f3acf85ffa2",$''',
  '''^\n?    "schemas/public\-input\-bindings/zkc_credential_rebind_v2\.json": "4b90fb39151476e9248cdabcd16de6e354ab9dc0b279e7f12febea823250237e",$''',
  '''^\n?    "artifacts/zkc_credential_rebind/zkc_credential_rebind\.json": "f8629686cf8973b4859340d71a51ee4372e5fcc884244af6a505f6578630d4a6",$''',
  '''^\n?    "artifacts/zkc_credential_rebind_v2/zkc_credential_rebind_v2\.json": "3d02e356a5962e6156e0555da2f72144047add1065fd6f3cc08becddb927f9cc",$''',
]
paths = [
  '''^tests/vectors/rebind_containment_bytes_v1\.json$''',
]
